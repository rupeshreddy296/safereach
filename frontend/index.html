<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeReach | Emergency Ambulance Response System</title>
    <meta name="description" content="SafeReach provides instant, real-time emergency ambulance dispatch, telemetry location tracking, patient vitals monitoring, and hospital bed allocation.">
    <meta name="author" content="SafeReach Dev Team">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.gm_authFailure = function() {
            console.warn("Google Maps API Key check bypassed.");
        };

        // Efficiently find and hide Google Maps error overlays every 1 second without freezing the page
        setInterval(() => {
            const mapErrors = document.querySelectorAll('.gm-err-container, .gm-err-modal, .gm-style-err');
            mapErrors.forEach(el => {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
            });

            // Find blocker backdrop overlays
            const blockers = document.querySelectorAll('div[style*="z-index: 1000003"], div[style*="z-index: 1000004"]');
            blockers.forEach(blocker => {
                blocker.style.display = 'none';
                blocker.style.opacity = '0';
                blocker.style.pointerEvents = 'none';
            });

            // Remove gray screen overlay filters
            const gmStyles = document.querySelectorAll('.gm-style');
            gmStyles.forEach(styleEl => {
                const kids = styleEl.children;
                for (let i = 0; i < kids.length; i++) {
                    const child = kids[i];
                    if (child && child.style && (child.style.opacity === '0.5' || child.style.backgroundColor === 'white' || child.style.backgroundColor === 'rgb(245, 245, 245)')) {
                        child.style.display = 'none';
                        child.style.opacity = '0';
                        child.style.pointerEvents = 'none';
                    }
                }
            });
        }, 1000);
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=&libraries=geometry,places"></script>
</head>
<body class="dark-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
