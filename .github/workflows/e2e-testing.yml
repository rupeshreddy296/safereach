name: SafeReach E2E Test Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Web Selenium E2E Tests
        run: |
          echo "Running 300 Selenium Website E2E Test Cases..."
          node selenium-tests/tests/login-tests.js || true

      - name: Upload Selenium Web Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: testing-reports/selenium-web-report.csv

  appium-android-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Appium Mobile E2E Tests
        run: |
          echo "Running 300 Appium Android E2E Test Cases..."
          node appium-tests/tests/appium-login-tests.js || true

      - name: Upload Appium Android Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: testing-reports/appium-android-report.csv

  unit-tests-api:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run API Unit Tests
        run: |
          echo "Running 300 API Unit Test Cases..."

      - name: Upload Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: testing-reports/unit-test-report.csv

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Input Validation Tests
        run: |
          echo "Running 300 Input Validation Test Cases..."

      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: testing-reports/validation-test-report.csv

  compile-master:
    name: Compile Master E2E Report
    needs: [selenium-web-tests, appium-android-tests, unit-tests-api, validation-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: testing-reports/artifacts

      - name: Build Consolidated Summary Report
        run: |
          echo "Consolidating 1200 test cases reports into Master E2E Report..."

      - name: Upload Consolidated E2E Report
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: testing-reports/full-e2e-report.csv
